name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (dev)
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  dogfood-action:
    # Prove the composite Action works end-to-end against the example tree.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          root-dir: example

  # Single non-matrix aggregator — this is the check to require in branch
  # protection. Requiring the matrix `test` job directly would fail: GitHub
  # renames it to `test (3.11)` etc., so the bare `test` context never reports.
  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: [test, dogfood-action]
    if: always()
    steps:
      - name: Verify required jobs succeeded
        run: |
          if [ "${{ needs.test.result }}" != "success" ] \
             || [ "${{ needs.dogfood-action.result }}" != "success" ]; then
            echo "A required job did not succeed (test=${{ needs.test.result }}, dogfood-action=${{ needs.dogfood-action.result }})"
            exit 1
          fi
          echo "All required jobs succeeded."
