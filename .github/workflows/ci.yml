name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Refuse the organisation's private terms (the DATA_LEAK_DENYLIST secret) in this event's commits:
  # added lines, file paths, commit messages and authors.
  data-leak-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: kilotronic/data-leak-check@f1da8a7ce76bfaabd70ea815d9417fb691e95799 # v1.1.0
        with:
          denylist: ${{ secrets.DATA_LEAK_DENYLIST }}

  # Secrets in this event's commits: gitleaks (anything shaped like a secret) and trufflehog (keys that still
  # work), from kilotronic/secret-scan.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: kilotronic/secret-scan@2665d6f2f0260d3ae0defbedcce27fc63ad6a168 # v1.2.1

  # Shell scripts (shellcheck), workflows (actionlint), and actions and base images pinned by commit and
  # digest, from kilotronic/lint.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: kilotronic/lint@b5343bfa69d890919c8774733da372d13d23d6d3 # v1.3.1

  # Real authors on this event's commits, in the owner's domains, from kilotronic/git-identity.
  git-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: kilotronic/git-identity@b0d54e809d81cabf61d357cbe519a9b9263b17cb # v2.4.0
        with:
          domains: ixid.net, kilotronic.com
          commit-subject: true

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (dev)
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  dogfood-action:
    # Prove the composite Action works end-to-end against the example tree.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./
        with:
          root-dir: example

  prek-hook:
    # The pre-commit/prek hook, through prek try-repo: the example tree passes, an undeclared file is refused.
    runs-on: ubuntu-latest
    env:
      GIT_AUTHOR_NAME: ci
      GIT_AUTHOR_EMAIL: ci@kilotronic.com
      GIT_COMMITTER_NAME: ci
      GIT_COMMITTER_EMAIL: ci@kilotronic.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: pip install prek==0.5.11
      - name: prek try-repo against the example tree
        run: |
          hooks="$GITHUB_WORKSPACE"
          cd "$(mktemp -d)" && git init -q
          cp -r "$hooks/example/." . && git add -A
          prek try-repo "$hooks" vendored-license-check --all-files
          echo "x" > vendor/undeclared.js && git add -A
          if prek try-repo "$hooks" vendored-license-check --all-files; then
            echo "::error::the undeclared file was not refused"; exit 1
          fi

  # The format and lint bundle from .pre-commit-config.yaml (formatters, ruff, markdownlint, yamllint, ...),
  # the same hooks a commit runs. The identity, secret and private-term hooks run as their own jobs.
  prek:
    name: Format and lint (prek)
    runs-on: ubuntu-latest
    env:
      SKIP: git-identity,commit-subject,session-trailer,secret-scan,secret-scan-push,data-leak-check,data-leak-check-commit-msg,data-leak-check-pre-push
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: pipx run prek==0.5.11 run --all-files --show-diff-on-failure

  # Single non-matrix aggregator — this is the check to require in branch
  # protection. Requiring the matrix `test` job directly would fail: GitHub
  # renames it to `test (3.11)` etc., so the bare `test` context never reports.
  ci:
    name: ci
    runs-on: ubuntu-latest
    needs:
      [
        test,
        dogfood-action,
        prek-hook,
        secret-scan,
        lint,
        git-identity,
        data-leak-check,
        prek,
      ]
    if: always()
    steps:
      # Every job in needs: is checked and must succeed, so a new job only has to be added there.
      - name: Verify required jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            [[ "$r" = success ]] || exit 1
          done
