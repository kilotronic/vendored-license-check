[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vendored-license-check"
version = "1.1.0"
description = "Pre-commit hook & GitHub Action: enforce declared, allow-listed licenses on vendored asset files committed into a repo."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kilotronic LLC" }]
keywords = [
  "license",
  "compliance",
  "vendored",
  "pre-commit",
  "spdx",
  "supply-chain",
  "attribution",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [] # stdlib-only (tomllib on 3.11+)

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
vendored-license-check = "vendored_license_check.check:main"

[project.urls]
Homepage = "https://github.com/kilotronic/vendored-license-check"
Issues = "https://github.com/kilotronic/vendored-license-check/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/vendored_license_check"]

[tool.pytest.ini_options]
testpaths = ["tests"]
